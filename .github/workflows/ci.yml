name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      - run: python3 scripts/check_release.py
      - run: python3 scripts/test_native_toolchain.py
      - run: cargo fmt --all -- --check
      - run: cargo nextest run --locked
      - run: cargo clippy --bin lg-hue-sync -- -D warnings
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --cwd frontend --frozen-lockfile
      - run: make dashboard-check
      - name: Verify embedded dashboard matches sources
        run: git diff --exit-code -- src/web/ui.html

  webos-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make build-docker
      - name: Verify ARMv7 Linux artifact
        run: file target/armv7-unknown-linux-gnueabi/release/lg-hue-sync | grep -q 'ELF 32-bit.*ARM'
      - name: Stage release binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp target/armv7-unknown-linux-gnueabi/release/lg-hue-sync release/lg-hue-sync-armv7
          sha256sum release/lg-hue-sync-armv7 > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: webos-armv7-release
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, webos-target]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v5
        with:
          name: webos-armv7-release
          path: release
      - name: Publish verified daemon release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --title "LG Hue Sync ${GITHUB_REF_NAME}" --notes-file release-notes.md
