[package]
name = "lg-hue-sync"
version = "0.3.0"
edition = "2021"
description = "Native webOS screen capture and Philips Hue Entertainment synchronizer for LG C1"
authors = ["Adam <adam@adeze.com>"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
byteorder = "1.5"
ureq = { version = "2.9", features = ["json"] }
openssl = { version = "0.10", features = ["vendored"] }
libloading = "0.8"
sd-notify = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
