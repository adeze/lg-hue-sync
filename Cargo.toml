[package]
name = "lg-hue-sync"
version = "0.4.0"
edition = "2021"
description = "Native webOS screen capture with Philips Hue Entertainment and Nanoleaf 4D output"
authors = ["Adam <adam@adeze.com>"]
license = "MIT"
repository = "https://github.com/adeze/lg-hue-sync"
homepage = "https://github.com/adeze/lg-hue-sync"
keywords = ["webos", "philips-hue", "nanoleaf", "ambilight", "rust"]
categories = ["multimedia::video", "embedded"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "net", "signal", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
axum = { version = "0.8", features = ["json"] }
byteorder = "1.5"
ureq = { version = "2.9", features = ["json"] }
openssl = { version = "0.10", features = ["vendored"] }
libloading = "0.8"
sd-notify = "0.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
